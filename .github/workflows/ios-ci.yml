
name: iOS CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test MeterInspect
    runs-on: macos-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: iOS/MeterInspect

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Check simulator and runner
        run: |
          echo "Runner memory:"
          memory_pressure
          echo "Disk space:"
          df -h
          echo "Available simulators:"
          xcrun simctl list devices available

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MeterInspect.xcodeproj \
            -scheme MeterInspect

      - name: Build MeterInspect
        run: |
          xcodebuild build \
            -project MeterInspect.xcodeproj \
            -scheme MeterInspect \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        timeout-minutes: 20
        run: |
          xcodebuild test \
            -project MeterInspect.xcodeproj \
            -scheme MeterInspect \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
