
name: React Native CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate React Native App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: React-Native/rn-user-directory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: React-Native/rn-user-directory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run Jest tests with coverage
        run: npm test -- --coverage --runInBand
